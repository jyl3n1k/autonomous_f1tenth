turtlebot3_vision_controller:
  ros__parameters:
    use_sim_time: true
    # Steering uses black camera pixels only. LiDAR is an emergency brake.
    use_lab_waypoints: false
    waypoint_recovery: false
    use_imu_heading: false
    waypoint_origin_x: 2.20
    waypoint_origin_y: 0.65
    detection_mode: black_line
    black_max_value: 55
    roi_top_fraction: 0.50
    near_row_fraction: 0.90
    far_row_fraction: 0.65
    sample_row_count: 12
    row_band_height: 3
    morphology_kernel: 1
    min_component_area: 40
    min_corridor_width: 2
    minimum_confidence: 0.50
    kp_lateral: 2.4
    kd_lateral: 0.015
    kp_heading: 1.8
    kp_heading_right: 1.8
    steering_smoothing: 0.65
    max_linear_speed: 0.12
    min_linear_speed: 0.035
    max_angular_speed: 1.4
    max_linear_acceleration: 0.25
    max_angular_acceleration: 3.0
    turn_slowdown: 0.8
    use_lidar_safety: true
    lidar_stop_distance: 0.14
    lidar_slow_distance: 0.24
    lidar_corner_gain: 0.0
    lidar_center_gain: 0.0
    sensor_timeout: 0.6
    image_timeout: 0.5
    publish_debug: true
