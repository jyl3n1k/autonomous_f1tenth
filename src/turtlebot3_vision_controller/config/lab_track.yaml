turtlebot3_vision_controller:
  ros__parameters:
    use_sim_time: true

    camera_topic: /turtlebot3/camera/image_raw
    scan_topic: /turtlebot3/scan
    command_topic: /turtlebot3/cmd_vel
    debug_image_topic: /turtlebot3/vision/debug_image
    debug_mask_topic: /turtlebot3/vision/corridor_mask
    publish_debug: true
    # Route-assisted mode: steering follows the surveyed centerline using
    # odometry; the camera detector runs for diagnostics. Set false to use
    # camera steering. This is not a camera-only controller configuration.
    use_lab_waypoints: true
    waypoint_recovery: false
    # Must match the pose used by cartrack.launch.py.
    waypoint_origin_x: 2.20
    waypoint_origin_y: 0.65
    waypoint_lookahead: 0.22
    # Correct wheel-heading drift with the robot's IMU, never Gazebo truth.
    use_imu_heading: true
    max_linear_acceleration: 0.20
    max_angular_acceleration: 1.50
    sensor_timeout: 0.60

    # Explicitly pair the two white boundary runs and follow their midpoint.
    detection_mode: white_walls
    roi_top_fraction: 0.30
    max_saturation: 55
    min_value: 165
    morphology_kernel: 3
    min_component_area: 80

    # At the installed camera pitch both walls leave the bottom of the frame;
    # sample the visible overlap instead of rejecting the image.
    near_row_fraction: 0.55
    far_row_fraction: 0.40
    sample_row_count: 10
    row_band_height: 5
    min_corridor_width: 12
    min_wall_width: 2
    minimum_confidence: 0.50

    kp_lateral: 1.35
    kd_lateral: 0.01
    # The far projection includes divider walls in this compact track.  The
    # near gap is the reliable steering signal, so do not steer from that
    # ambiguous far sample.
    kp_heading: 0.0
    kp_heading_right: 0.0
    heading_deadband: 0.08
    steering_smoothing: 0.40

    # LiDAR limits forward motion in both camera and route-assisted modes.
    # The scanner's minimum range is 0.12 m; stop above that blind zone.
    use_lidar_safety: true
    lidar_stop_distance: 0.14
    lidar_slow_distance: 0.40
    lidar_corner_gain: 0.80
    lidar_center_gain: 0.0

    max_linear_speed: 0.20
    min_linear_speed: 0.07
    max_angular_speed: 1.00
    turn_slowdown: 0.75
    image_timeout: 0.50
